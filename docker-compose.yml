services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: campus_postgres_db
    restart: always
    environment:
      POSTGRES_DB: campus_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache Service (Bonus Requirement)
  redis:
    image: redis:7-alpine
    container_name: campus_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: campus_fastapi_backend
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/campus_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super_secret_campus_key_docker_98765
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  # 4. React Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: host
    container_name: campus_react_frontend
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001/api
    depends_on:
      - backend

  # 5. Nginx Reverse Proxy Service (Bonus Requirement)
  nginx:
    image: nginx:alpine
    container_name: campus_nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
